name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: MSK2K_Linux.zip
            asset_name: msk2k
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: MSK2K_Windows.zip
            asset_name: msk2k.exe
          # macOS (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: MSK2K_macOS.zip
            asset_name: msk2k

    steps:
    - uses: actions/checkout@v4

    # --- 1. Install System Dependencies ---
    - name: Install Linux Deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libasound2t64 libwayland-dev libxkbcommon-dev libhamlib-dev libhamlib-utils

    - name: Install macOS Deps
      if: runner.os == 'macOS'
      run: brew install hamlib

    # --- 2. Install Rust ---
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # --- 3. Build Your App ---
    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }} --verbose

    # --- 4. APPLE CODE SIGNING & NOTARIZATION (macOS only) ---

    - name: Install Apple Certificate
      if: runner.os == 'macOS'
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create and configure temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate (without -t and -f flags for compatibility)
        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
          -A -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: \
          -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH

        # Verify signing identity is available
        security find-identity -v -p codesigning $KEYCHAIN_PATH

    - name: Code Sign macOS Binary
      if: runner.os == 'macOS'
      run: |
        # Find the Developer ID identity automatically
        IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "Signing with identity: $IDENTITY"

        # Sign the main binary with hardened runtime
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          target/${{ matrix.target }}/release/${{ matrix.asset_name }}

        # Verify the signature
        codesign --verify --verbose target/${{ matrix.target }}/release/${{ matrix.asset_name }}

    - name: Code Sign rigctld
      if: runner.os == 'macOS'
      run: |
        IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

        # Sign rigctld too, otherwise macOS may block it
        RIGCTLD_PATH=$(brew --prefix)/bin/rigctld
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          "$RIGCTLD_PATH"

    # --- 5. PREPARE PACKAGE ---

    # LINUX PACKAGE
    - name: Bundle Linux
      if: runner.os == 'Linux'
      run: |
        mkdir -p release_pkg/tools
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} release_pkg/
        cp /usr/bin/rigctld release_pkg/tools/
        cd release_pkg
        zip -r ../${{ matrix.artifact_name }} .

    # MACOS PACKAGE
    - name: Bundle macOS
      if: runner.os == 'macOS'
      run: |
        mkdir -p release_pkg/tools
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} release_pkg/
        cp $(brew --prefix)/bin/rigctld release_pkg/tools/
        cd release_pkg
        zip -r ../${{ matrix.artifact_name }} .

    # WINDOWS PACKAGE
    - name: Bundle Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/Hamlib/Hamlib/releases/download/4.5.5/hamlib-w64-4.5.5.zip" -OutFile "hamlib.zip"
        Expand-Archive -Path "hamlib.zip" -DestinationPath "hamlib_temp"
        New-Item -ItemType Directory -Force -Path "release_pkg/tools"
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -Destination "release_pkg/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/rigctld.exe" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/"
        Compress-Archive -Path "release_pkg/*" -DestinationPath "${{ matrix.artifact_name }}"

    # --- 6. NOTARIZE macOS package ---
    - name: Notarize macOS Package
      if: runner.os == 'macOS'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        # Submit the zip for notarization
        xcrun notarytool submit ${{ matrix.artifact_name }} \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait --timeout 30m

        echo "Notarization complete!"

    # --- 7. Clean up keychain ---
    - name: Clean up Apple keychain
      if: runner.os == 'macOS' && always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

    # --- 8. Upload Artifacts ---
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  # --- 9. CREATE RELEASE (Only on Tag push) ---
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/MSK2K_Linux.zip/MSK2K_Linux.zip
          artifacts/MSK2K_Windows.zip/MSK2K_Windows.zip
          artifacts/MSK2K_macOS.zip/MSK2K_macOS.zip
