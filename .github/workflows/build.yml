name: Build MSK2K

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: msk2k-linux
            asset_name: msk2k
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: msk2k-windows.exe
            asset_name: msk2k.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: msk2k-macos
            asset_name: msk2k

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libasound2t64 libwayland-dev libxkbcommon-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }} --verbose

    - name: Rename Binary (Linux/Mac)
      if: runner.os != 'Windows'
      run: mv target/${{ matrix.target }}/release/${{ matrix.asset_name }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Rename Binary (Windows)
      if: runner.os == 'Windows'
      run: mv target/${{ matrix.target }}/release/${{ matrix.asset_name }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List Artifacts
      run: find artifacts -type f

    - name: Create Release with Binaries
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/msk2k-linux/msk2k-linux
          artifacts/msk2k-windows.exe/msk2k-windows.exe
          artifacts/msk2k-macos/msk2k-macos
