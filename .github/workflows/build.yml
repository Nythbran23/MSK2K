name: Build MSK2K

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers when you push a tag like v0.0.1
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: msk2k-linux
            asset_name: msk2k
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: msk2k-windows.exe
            asset_name: msk2k.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: msk2k-macos
            asset_name: msk2k

    steps:
    - uses: actions/checkout@v3

    # Install Linux Dependencies (Audio + GUI)
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libasound2t64 libwayland-dev libxkbcommon-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build Release
      run: cargo build --release --verbose

    # Rename binary for clarity before uploading
    - name: Rename Binary (Linux/Mac)
      if: runner.os != 'Windows'
      run: mv target/release/msk2k target/release/${{ matrix.artifact_name }}

    - name: Rename Binary (Windows)
      if: runner.os == 'Windows'
      run: mv target/release/msk2k.exe target/release/${{ matrix.artifact_name }}

    # Upload the compiled file to the GitHub Actions page
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: target/release/${{ matrix.artifact_name }}

  # Optional: Create a GitHub Release automatically when you push a tag
  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true