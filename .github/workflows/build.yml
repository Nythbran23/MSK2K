name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: MSK2K_Linux.zip
            asset_name: msk2k
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: MSK2K_Windows.zip
            asset_name: msk2k.exe
          # macOS (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: MSK2K_macOS.dmg
            asset_name: msk2k

    steps:
    - uses: actions/checkout@v4

    # --- 1. Install System Dependencies ---
    - name: Install Linux Deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libasound2t64 libwayland-dev libxkbcommon-dev libhamlib-dev libhamlib-utils

    - name: Install macOS Deps
      if: runner.os == 'macOS'
      run: brew install hamlib

    # --- 2. Install Rust ---
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # --- 3. Build Your App ---
    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }} --verbose

    # --- 4. APPLE CODE SIGNING & NOTARIZATION (macOS only) ---

    - name: Install Apple Certificate
      if: runner.os == 'macOS'
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
          -A -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: \
          -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH

        security find-identity -v -p codesigning $KEYCHAIN_PATH

    - name: Create macOS .app Bundle
      if: runner.os == 'macOS'
      run: |
        APP_DIR="MSK2K.app"
        CONTENTS="$APP_DIR/Contents"
        MACOS="$CONTENTS/MacOS"
        RESOURCES="$CONTENTS/Resources"
        FRAMEWORKS="$CONTENTS/Frameworks"

        mkdir -p "$MACOS/tools" "$RESOURCES" "$FRAMEWORKS"

        # Copy main binary
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} "$MACOS/msk2k"
        chmod +x "$MACOS/msk2k"

        # Copy rigctld into the bundle
        cp $(brew --prefix)/bin/rigctld "$MACOS/tools/rigctld"
        chmod +x "$MACOS/tools/rigctld"

        # --- Bundle libhamlib ---
        HAMLIB_LIB=$(brew --prefix hamlib)/lib
        echo "=== Hamlib lib dir ==="
        ls -la "$HAMLIB_LIB"/libhamlib*.dylib

        cp -L "$HAMLIB_LIB/libhamlib.4.dylib" "$FRAMEWORKS/libhamlib.4.dylib"

        # --- Bundle libusb (required by rigctld and libhamlib) ---
        LIBUSB_LIB=$(brew --prefix libusb)/lib
        echo "=== libusb lib dir ==="
        ls -la "$LIBUSB_LIB"/libusb*.dylib

        cp -L "$LIBUSB_LIB/libusb-1.0.0.dylib" "$FRAMEWORKS/libusb-1.0.0.dylib"

        # --- Rewrite library paths ---
        echo "=== rigctld dependencies before ==="
        otool -L "$MACOS/tools/rigctld"

        # Rewrite rigctld -> libhamlib
        install_name_tool -change \
          "$(otool -L "$MACOS/tools/rigctld" | grep libhamlib | awk '{print $1}')" \
          "@executable_path/../Frameworks/libhamlib.4.dylib" \
          "$MACOS/tools/rigctld"

        # Rewrite rigctld -> libusb
        install_name_tool -change \
          "$(otool -L "$MACOS/tools/rigctld" | grep libusb | awk '{print $1}')" \
          "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
          "$MACOS/tools/rigctld"

        # Fix libhamlib's own install name
        install_name_tool -id \
          "@executable_path/../Frameworks/libhamlib.4.dylib" \
          "$FRAMEWORKS/libhamlib.4.dylib"

        # Rewrite libhamlib -> libusb
        install_name_tool -change \
          "$(otool -L "$FRAMEWORKS/libhamlib.4.dylib" | grep libusb | awk '{print $1}')" \
          "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
          "$FRAMEWORKS/libhamlib.4.dylib"

        # Fix libusb's own install name
        install_name_tool -id \
          "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
          "$FRAMEWORKS/libusb-1.0.0.dylib"

        echo "=== rigctld dependencies after ==="
        otool -L "$MACOS/tools/rigctld"

        echo "=== libhamlib dependencies after ==="
        otool -L "$FRAMEWORKS/libhamlib.4.dylib"

        echo "=== libusb dependencies ==="
        otool -L "$FRAMEWORKS/libusb-1.0.0.dylib"

        # --- Create Info.plist ---
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "Version from Cargo.toml: $VERSION"

        cat > "$CONTENTS/Info.plist" << PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>MSK2K</string>
            <key>CFBundleDisplayName</key>
            <string>MSK2K</string>
            <key>CFBundleIdentifier</key>
            <string>com.thedxshop.msk2k</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>msk2k</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSMicrophoneUsageDescription</key>
            <string>MSK2K needs microphone access for audio input from your radio.</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        PLIST

        echo "=== App bundle contents ==="
        find "$APP_DIR" -type f

    - name: Code Sign macOS App Bundle
      if: runner.os == 'macOS'
      run: |
        IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "Signing with identity: $IDENTITY"

        # Create entitlements file for audio access
        cat > entitlements.plist << 'ENT'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.device.audio-input</key>
            <true/>
        </dict>
        </plist>
        ENT

        # Sign from inside out: frameworks first, then nested binaries, then the bundle

        # 1a. Sign the bundled libusb
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          MSK2K.app/Contents/Frameworks/libusb-1.0.0.dylib

        # 1b. Sign the bundled libhamlib
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          MSK2K.app/Contents/Frameworks/libhamlib.4.dylib

        # 2. Sign rigctld
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          MSK2K.app/Contents/MacOS/tools/rigctld

        # 3. Sign the main app bundle
        codesign --force --options runtime \
          --sign "$IDENTITY" \
          --timestamp \
          --entitlements entitlements.plist \
          MSK2K.app

        # Verify
        codesign --verify --deep --strict --verbose=2 MSK2K.app
        echo "Signature verified OK"

    - name: Create DMG
      if: runner.os == 'macOS'
      run: |
        hdiutil create -volname "MSK2K" \
          -srcfolder MSK2K.app \
          -ov -format UDZO \
          MSK2K_unsigned.dmg

        IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        codesign --force --sign "$IDENTITY" --timestamp MSK2K_unsigned.dmg

        mv MSK2K_unsigned.dmg ${{ matrix.artifact_name }}
        echo "DMG created: ${{ matrix.artifact_name }}"
        ls -la ${{ matrix.artifact_name }}

    - name: Notarize macOS DMG
      if: runner.os == 'macOS'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcrun notarytool submit ${{ matrix.artifact_name }} \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait --timeout 30m

        xcrun stapler staple ${{ matrix.artifact_name }}

        echo "Notarization and stapling complete!"

    # --- 5. PREPARE PACKAGE (Linux and Windows only) ---

    # LINUX PACKAGE
    - name: Bundle Linux
      if: runner.os == 'Linux'
      run: |
        mkdir -p release_pkg/tools
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} release_pkg/
        cp /usr/bin/rigctld release_pkg/tools/
        cd release_pkg
        zip -r ../${{ matrix.artifact_name }} .

    # WINDOWS PACKAGE
    - name: Bundle Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/Hamlib/Hamlib/releases/download/4.5.5/hamlib-w64-4.5.5.zip" -OutFile "hamlib.zip"
        Expand-Archive -Path "hamlib.zip" -DestinationPath "hamlib_temp"
        New-Item -ItemType Directory -Force -Path "release_pkg/tools"
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -Destination "release_pkg/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/rigctld.exe" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/"
        Compress-Archive -Path "release_pkg/*" -DestinationPath "${{ matrix.artifact_name }}"

    # --- 6. Clean up keychain ---
    - name: Clean up Apple keychain
      if: runner.os == 'macOS' && always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

    # --- 7. Upload Artifacts ---
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  # --- 8. CREATE RELEASE (Only on Tag push) ---
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/MSK2K_Linux.zip/MSK2K_Linux.zip
          artifacts/MSK2K_Windows.zip/MSK2K_Windows.zip
          artifacts/MSK2K_macOS.dmg/MSK2K_macOS.dmg
