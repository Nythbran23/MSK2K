name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: MSK2K_Linux.zip
            asset_name: msk2k
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: MSK2K_Windows.zip
            asset_name: msk2k.exe
          # macOS (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: MSK2K_macOS.zip
            asset_name: msk2k

    steps:
    - uses: actions/checkout@v4

    # --- 1. Install System Dependencies ---
    - name: Install Linux Deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libasound2t64 libwayland-dev libxkbcommon-dev libhamlib-dev libhamlib-utils

    - name: Install macOS Deps
      if: runner.os == 'macOS'
      run: brew install hamlib

    # --- 2. Install Rust ---
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # --- 3. Build Your App ---
    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }} --verbose

    # --- 4. DEBUG CERTIFICATE (temporary - replace with real import once working) ---
    - name: Debug Certificate Import
      if: runner.os == 'macOS'
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12

        # Decode and check file size
        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo "=== File size ==="
        ls -la $CERTIFICATE_PATH

        # Check it's a valid p12
        echo "=== File type ==="
        file $CERTIFICATE_PATH

        # Check password length (without revealing it)
        echo "=== Password length: ${#CERTIFICATE_PASSWORD} ==="

        # Try openssl to verify the p12 independently (try both with and without -legacy)
        echo "=== OpenSSL with -legacy flag ==="
        openssl pkcs12 -in $CERTIFICATE_PATH -nokeys -passin env:CERTIFICATE_PASSWORD -legacy 2>&1 || true

        echo "=== OpenSSL without -legacy flag ==="
        openssl pkcs12 -in $CERTIFICATE_PATH -nokeys -passin env:CERTIFICATE_PASSWORD 2>&1 || true

        echo "=== OpenSSL info ==="
        openssl version

        # Now try the actual import
        echo "=== Attempting security import ==="
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Try import with verbose output
        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH 2>&1 || echo "IMPORT FAILED"

        # Try alternate import without -t and -f flags
        echo "=== Trying alternate import ==="
        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
          -A -k $KEYCHAIN_PATH 2>&1 || echo "ALTERNATE IMPORT ALSO FAILED"

        # List what's in the keychain anyway
        echo "=== Keychain contents ==="
        security find-identity -v -p codesigning $KEYCHAIN_PATH 2>&1 || true

    # --- 5. PREPARE PACKAGE ---

    # LINUX PACKAGE
    - name: Bundle Linux
      if: runner.os == 'Linux'
      run: |
        mkdir -p release_pkg/tools
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} release_pkg/
        cp /usr/bin/rigctld release_pkg/tools/
        cd release_pkg
        zip -r ../${{ matrix.artifact_name }} .

    # MACOS PACKAGE (signing disabled until certificate issue resolved)
    - name: Bundle macOS
      if: runner.os == 'macOS'
      run: |
        mkdir -p release_pkg/tools
        cp target/${{ matrix.target }}/release/${{ matrix.asset_name }} release_pkg/
        cp $(brew --prefix)/bin/rigctld release_pkg/tools/
        cd release_pkg
        zip -r ../${{ matrix.artifact_name }} .

    # WINDOWS PACKAGE
    - name: Bundle Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/Hamlib/Hamlib/releases/download/4.5.5/hamlib-w64-4.5.5.zip" -OutFile "hamlib.zip"
        Expand-Archive -Path "hamlib.zip" -DestinationPath "hamlib_temp"
        New-Item -ItemType Directory -Force -Path "release_pkg/tools"
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -Destination "release_pkg/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/rigctld.exe" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/tools/"
        Copy-Item "hamlib_temp/hamlib-w64-4.5.5/bin/*.dll" -Destination "release_pkg/"
        Compress-Archive -Path "release_pkg/*" -DestinationPath "${{ matrix.artifact_name }}"

    # --- 6. Upload Artifacts ---
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}

  # --- 7. CREATE RELEASE (Only on Tag push) ---
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/MSK2K_Linux.zip/MSK2K_Linux.zip
          artifacts/MSK2K_Windows.zip/MSK2K_Windows.zip
          artifacts/MSK2K_macOS.zip/MSK2K_macOS.zip
