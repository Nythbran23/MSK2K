[package]
name = "msk2k_audio"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio I/O
cpal = "0.15"

# Sample rate conversion
rubato = "0.15"

# Async runtime (for non-blocking audio)
tokio = { version = "1.41", features = ["sync", "time", "rt-multi-thread", "macros"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"

# Optional features
serde = { version = "1.0", features = ["derive"], optional = true }

# 🟢 Windows-Only WASAPI Exclusive Bypass
[target.'cfg(windows)'.dependencies]
wasapi = "0.13.0"

[dev-dependencies]
env_logger = "0.11"
hound = "3.5"  # WAV file I/O for examples

[features]
default = []
serde = ["dep:serde"]